<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pozabljeno geslo · Moj knjižni kotiček</title>
  <link rel="stylesheet" href="/static/style.css?v=1.0.5-upgrades">
</head>
<body>
<main class="container login-shell">
  <section class="panel login-panel">
    <div class="brand login-brand">
      <span class="brand-icon">📚</span>
      <div><strong>MOJ KNJIŽNI KOTIČEK</strong><small>Ponastavitev gesla</small></div>
    </div>
    <h1>Pozabljeno geslo</h1>
    <p class="muted">Vpišite svoje uporabniško ime ali e-poštni naslov, povezan z vašim računom.</p>

    {% if notice %}<div class="notice success-notice">{{ notice }}</div>{% endif %}
    {% if error %}<div class="notice error-notice">{{ error }}</div>{% endif %}

    <form method="post" action="/forgot-password" class="stack">
      <label>Uporabniško ime ali e-pošta
        <input name="identifier" placeholder="npr. janez ali janez@primer.si" required autofocus>
      </label>
      <button class="btn primary full-width">POŠLJI POVEZAVO ZA PONASTAVITEV</button>
    </form>

    <div style="text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e2e8f0;">
      <a href="/login">Nazaj na prijavo</a>
    </div>
  </section>
</main>
</body>
</html>
