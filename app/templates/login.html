<!doctype html>
<html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prijava · Moj knjižni kotiček</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="container login-shell"><section class="panel login-panel">
<div class="brand login-brand"><span class="brand-icon">📚</span><div><strong>MOJ KNJIŽNI KOTIČEK</strong><small>Skupna družinska knjižnica</small></div></div>
<h1>Prijava</h1><p class="muted">Vpiši svoje uporabniško ime in geslo.</p>
{% if error %}<div class="notice">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="stack"><input type="hidden" name="next" value="{{ next }}"><label>Uporabniško ime<input name="username" autocomplete="username" required autofocus></label><label>Geslo<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary">PRIJAVA</button></form>
</section></main></body></html>
