<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Registracija računa · Moj knjižni kotiček</title>
  <link rel="stylesheet" href="/static/style.css?v=1.0.5-upgrades">
</head>
<body>
<main class="container login-shell">
  <section class="panel login-panel">
    <div class="brand login-brand">
      <span class="brand-icon">📚</span>
      <div><strong>MOJ KNJIŽNI KOTIČEK</strong><small>Ustvarjanje novega računa</small></div>
    </div>
    <h1>Registracija</h1>
    <p class="muted">Ustvarite svoj uporabniški račun za dostop do skupne knjižnice.</p>

    {% if error %}<div class="notice error-notice">{{ error }}</div>{% endif %}

    <form method="post" action="/register" class="stack">
      <label>Uporabniško ime *
        <input name="username" autocomplete="username" placeholder="npr. janez_novak" minlength="3" maxlength="50" required autofocus>
        <small class="muted">Brez presledkov (3–50 znakov).</small>
      </label>
      <label>Prikazno ime (Ime in priimek) *
        <input name="display_name" placeholder="npr. Janez Novak" required>
      </label>
      <label>E-poštni naslov
        <input type="email" name="email" placeholder="npr. janez@primer.si">
        <small class="muted">Za obvestila in morebitno ponastavitev gesla.</small>
      </label>
      <label>Geslo *
        <input type="password" name="password" autocomplete="new-password" minlength="12" placeholder="••••••••••••" required>
        <small class="muted">Najmanj 12 znakov zaradi varnosti.</small>
      </label>
      <label>Potrditev gesla *
        <input type="password" name="confirm_password" autocomplete="new-password" minlength="12" placeholder="••••••••••••" required>
      </label>
      <button class="btn primary full-width">USTVARI RAČUN</button>
    </form>

    <div style="text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e2e8f0;">
      Že imate račun? <a href="/login"><strong>Prijava</strong></a>
    </div>
  </section>
</main>
</body>
</html>
