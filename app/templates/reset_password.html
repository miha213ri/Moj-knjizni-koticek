<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nastavitev novega gesla · Moj knjižni kotiček</title>
  <link rel="stylesheet" href="/static/style.css?v=1.0.5-upgrades">
</head>
<body>
<main class="container login-shell">
  <section class="panel login-panel">
    <div class="brand login-brand">
      <span class="brand-icon">📚</span>
      <div><strong>MOJ KNJIŽNI KOTIČEK</strong><small>Varno geslo</small></div>
    </div>
    <h1>Novo geslo</h1>
    <p class="muted">Vnesite svoje novo geslo. Geslo mora imeti najmanj 12 znakov.</p>

    {% if error %}<div class="notice error-notice">{{ error }}</div>{% endif %}

    <form method="post" action="/reset-password" class="stack">
      <input type="hidden" name="token" value="{{ token }}">
      <label>Novo geslo *
        <input type="password" name="password" minlength="12" placeholder="••••••••••••" required autofocus>
      </label>
      <label>Potrditev novega gesla *
        <input type="password" name="confirm_password" minlength="12" placeholder="••••••••••••" required>
      </label>
      <button class="btn primary full-width">SHRANI NOVO GESLO</button>
    </form>

    <div style="text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #e2e8f0;">
      <a href="/login">Prekliči in nazaj na prijavo</a>
    </div>
  </section>
</main>
</body>
</html>
